<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Basic HTML with JavaScript</title>
</head>
<body>
    <h1>My First HTML + JavaScript Example</h1>
   
    <!-- Button to trigger JavaScript -->
      <p id="message">Click the button to see a message.</p>
    <button onclick="showMessage()">Click Me</button>

    <!-- JavaScript code -->
    <script>
        // Function to change the text content of the paragraph
        function showMessage() {
            alert("Hello! You clicked the button.");    
        }
    </script>
</body>
</html>
